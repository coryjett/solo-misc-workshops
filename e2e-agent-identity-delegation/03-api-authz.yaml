# Demo 3: MCP -> API authorization. The API route accepts ONLY STS-issued
# delegated tokens (issuer = the STS), and only when the acting agent is
# agent-x's identity. A raw user token from Keycloak is rejected: APIs are
# reachable exclusively through the delegated identity chain.
# (This lab hosts the route on agentgateway; the same JWT+CEL policy shape
# applies unchanged on a Solo Enterprise kgateway route.)
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-backend, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-backend } }
  template:
    metadata: { labels: { app: api-backend } }
    spec: { containers: [ { name: app, image: mccutchen/go-httpbin:v2.15.0, ports: [ { containerPort: 8080 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: api-backend, namespace: e2e-demo }
spec: { selector: { app: api-backend }, ports: [ { port: 8000, targetPort: 8080 } ] }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: api-backend, namespace: e2e-demo }
spec:
  parentRefs: [ { name: e2e-gw } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /api } } ]
      filters: [ { type: URLRewrite, urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } } } ]
      backendRefs: [ { name: api-backend, port: 8000 } ]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: api-authz, namespace: e2e-demo }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: HTTPRoute, name: api-backend } ]
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: enterprise-agentgateway.agentgateway-system.svc.cluster.local:7777
          jwks:
            remote:
              backendRef: { name: enterprise-agentgateway, namespace: agentgateway-system, port: 7777 }
              jwksPath: /.well-known/jwks.json
    authorization:
      action: Require
      policy:
        matchExpressions:
          - "jwt.act.sub == 'system:serviceaccount:wp-a:default'"
