# Agent stand-in, two MCP servers, and the API. Plain Deployments and Services.
apiVersion: v1
kind: Namespace
metadata: { name: e2e-demo }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: agent-x, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: agent-x } }
  template:
    metadata: { labels: { app: agent-x } }
    spec: { containers: [ { name: app, image: mccutchen/go-httpbin:v2.15.0, ports: [ { containerPort: 8080 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: agent-x, namespace: e2e-demo }
spec: { selector: { app: agent-x }, ports: [ { port: 8000, targetPort: 8080 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-a } }
  template:
    metadata: { labels: { app: mcp-a } }
    spec: { containers: [ { name: mcp, image: ghcr.io/peterj/mcp-website-fetcher:main, ports: [ { containerPort: 8000 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  selector: { app: mcp-a }
  ports: [ { port: 80, targetPort: 8000, appProtocol: agentgateway.dev/mcp } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-b } }
  template:
    metadata: { labels: { app: mcp-b } }
    spec: { containers: [ { name: mcp, image: ghcr.io/peterj/mcp-website-fetcher:main, ports: [ { containerPort: 8000 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  selector: { app: mcp-b }
  ports: [ { port: 80, targetPort: 8000, appProtocol: agentgateway.dev/mcp } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-backend, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-backend } }
  template:
    metadata: { labels: { app: api-backend } }
    spec: { containers: [ { name: app, image: mccutchen/go-httpbin:v2.15.0, ports: [ { containerPort: 8080 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: api-backend, namespace: e2e-demo }
spec: { selector: { app: api-backend }, ports: [ { port: 8000, targetPort: 8080 } ] }
