# Test client. Its ServiceAccount (system:serviceaccount:wp-a:default) is the agent identity in the STS exchange.
apiVersion: v1
kind: Namespace
metadata: { name: wp-a }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sleep, namespace: wp-a }
spec:
  replicas: 1
  selector: { matchLabels: { app: sleep } }
  template:
    metadata: { labels: { app: sleep } }
    spec:
      containers:
        - name: sleep
          image: curlimages/curl:8.9.1
          command: ["sleep", "infinity"]
