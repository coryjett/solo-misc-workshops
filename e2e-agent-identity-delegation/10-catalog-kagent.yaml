# Catalog entries with container images for the kagent runtime.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: agent-x-kagent
  tag: "1.0.0"
spec:
  description: "Demo agent. Users in agent-x-users may call it. Bring-your-own image that answers every path, including the A2A agent card kagent probes, on port 8080."
  source:
    image: traefik/whoami:v1.11.0
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-a-kagent
  tag: latest
spec:
  title: mcp-a-kagent
  description: MCP server agent-x is authorized to use.
  source:
    package:
      origin:
        type: oci
        identifier: ghcr.io/peterj/mcp-website-fetcher:main
        oci: { serverName: io.solo.workshop/mcp-a-kagent }
      transport:
        type: http
        port: 8000
        path: /sse
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-b-kagent
  tag: latest
spec:
  title: mcp-b-kagent
  description: MCP server agent-x is not authorized to use.
  source:
    package:
      origin:
        type: oci
        identifier: ghcr.io/peterj/mcp-website-fetcher:main
        oci: { serverName: io.solo.workshop/mcp-b-kagent }
      transport:
        type: http
        port: 8000
        path: /sse
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-api-kagent
  tag: latest
spec:
  title: mcp-api-kagent
  description: MCP server whose tool calls the httpbin API through the gateway with the caller's token.
  source:
    package:
      origin:
        type: oci
        identifier: ghcr.io/coryjett/e2e-mcp-api:v1
        oci: { serverName: io.solo.workshop/mcp-api-kagent }
      transport:
        type: http
        port: 8000
        path: /mcp
