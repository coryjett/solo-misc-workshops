# Gateway e2e-gw and its tracing policy. Existing Solo UI: set the backendRef namespace to your management release.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: e2e-gw, namespace: e2e-demo }
spec:
  gatewayClassName: enterprise-agentgateway
  # WARNING: with no annotations the controller asks the platform for its default
  # LoadBalancer, which on a cloud provider means a PUBLIC address. On kind it
  # stays pending and nothing notices, which is why this is easy to miss.
  # The lab itself never needs the address, since every request comes from the
  # in-cluster sleep pod. An INTERNAL LoadBalancer is still worth having if you
  # want to reach the gateway from your own network: it gives a private address
  # and no internet exposure. Uncomment the block for your provider.
  # infrastructure:
  #   annotations:
  #     # GKE
  #     networking.gke.io/load-balancer-type: Internal
  #     networking.gke.io/internal-load-balancer-allow-global-access: "true"
  #     cloud.google.com/l4-rbs: enabled
  #     # EKS
  #     # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  #     # AKS
  #     # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes: { namespaces: { from: Same } }
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: tracing, namespace: e2e-demo }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: Gateway, name: e2e-gw } ]
  frontend:
    tracing:
      backendRef: { name: solo-enterprise-telemetry-collector, namespace: kagent, kind: Service, port: 4317 }
      randomSampling: "true"
