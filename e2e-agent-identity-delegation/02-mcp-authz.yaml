# Demo 2: agent -> MCP authorization. Two MCP servers behind the gateway;
# the caller's identity decides which is reachable. (Dry run authorizes on
# the user group; in the full flow the delegated token's act claim is the
# agent identity and the CEL just changes to match it.)
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-a } }
  template:
    metadata: { labels: { app: mcp-a } }
    spec: { containers: [ { name: mcp, image: ghcr.io/peterj/mcp-website-fetcher:main, ports: [ { containerPort: 8000 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  selector: { app: mcp-a }
  ports: [ { port: 80, targetPort: 8000, appProtocol: agentgateway.dev/mcp } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-b } }
  template:
    metadata: { labels: { app: mcp-b } }
    spec: { containers: [ { name: mcp, image: ghcr.io/peterj/mcp-website-fetcher:main, ports: [ { containerPort: 8000 } ] } ] }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  selector: { app: mcp-b }
  ports: [ { port: 80, targetPort: 8000, appProtocol: agentgateway.dev/mcp } ]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  mcp:
    targets:
      - name: mcp-a
        static: { host: mcp-a.e2e-demo.svc.cluster.local, port: 80, protocol: SSE }
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  mcp:
    targets:
      - name: mcp-b
        static: { host: mcp-b.e2e-demo.svc.cluster.local, port: 80, protocol: SSE }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp-a, namespace: e2e-demo }
spec:
  parentRefs: [ { name: e2e-gw } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /mcp-a } } ]
      backendRefs: [ { name: mcp-a, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend } ]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp-b, namespace: e2e-demo }
spec:
  parentRefs: [ { name: e2e-gw } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /mcp-b } } ]
      backendRefs: [ { name: mcp-b, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend } ]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-a-authz, namespace: e2e-demo }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-a } ]
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/agentregistry
          jwks:
            remote:
              backendRef: { name: keycloak, namespace: keycloak, port: 8080 }
              jwksPath: /realms/agentregistry/protocol/openid-connect/certs
    authorization:
      action: Require
      policy:
        matchExpressions: [ "'agent-x-users' in jwt.Groups" ]
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-b-authz, namespace: e2e-demo }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-b } ]
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/agentregistry
          jwks:
            remote:
              backendRef: { name: keycloak, namespace: keycloak, port: 8080 }
              jwksPath: /realms/agentregistry/protocol/openid-connect/certs
    authorization:
      action: Require
      policy:
        matchExpressions: [ "'other-agents' in jwt.Groups" ]
