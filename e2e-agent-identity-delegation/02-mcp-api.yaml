# MCP server whose tool calls the API at API_BASE with the caller's bearer token.
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp-api, namespace: e2e-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-api } }
  template:
    metadata: { labels: { app: mcp-api } }
    spec:
      containers:
        - name: mcp
          image: ghcr.io/coryjett/e2e-mcp-api:v1
          imagePullPolicy: IfNotPresent
          ports: [ { containerPort: 8000 } ]
          env:
            - name: API_BASE
              value: http://e2e-gw.e2e-demo.svc.cluster.local:8080/api
---
apiVersion: v1
kind: Service
metadata: { name: mcp-api, namespace: e2e-demo }
spec:
  selector: { app: mcp-api }
  ports: [ { port: 80, targetPort: 8000, appProtocol: agentgateway.dev/mcp } ]
