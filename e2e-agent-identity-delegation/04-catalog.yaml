# Catalog entries for the workloads Part 1 deployed into namespace e2e-demo. Nothing is redeployed;
# the registry records what runs and where. 04-expose.yaml publishes the MCP servers through the registry gateway.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: agent-x
  tag: "1.0.0"
spec:
  description: "Demo agent behind the /agent-x route on e2e-gw. Users in agent-x-users may call it."
  source:
    image: mccutchen/go-httpbin:v2.15.0
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-a
  tag: latest
spec:
  title: mcp-a
  description: MCP server agent-x is authorized to use.
  remote:
    type: sse
    url: http://mcp-a.e2e-demo.svc.cluster.local:80/sse
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-b
  tag: latest
spec:
  title: mcp-b
  description: MCP server agent-x is not authorized to use.
  remote:
    type: sse
    url: http://mcp-b.e2e-demo.svc.cluster.local:80/sse
---
apiVersion: ar.dev/v1alpha1
kind: MCPServer
metadata:
  name: mcp-api
  tag: latest
spec:
  title: mcp-api
  description: MCP server whose tool calls the httpbin API through the gateway with the caller's token.
  remote:
    type: streamable-http
    url: http://mcp-api.e2e-demo.svc.cluster.local:80/mcp
