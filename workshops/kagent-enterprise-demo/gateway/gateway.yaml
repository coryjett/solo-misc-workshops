# agentgateway in front of company tools, for agents calling as the signed-in user.
# Users sign in to kagent with its bundled provider; the gateway validates those same tokens and
# decides tools by group: admins see records and inventory, writers see inventory only.
apiVersion: v1
kind: Service
metadata: { name: kagent-idp, namespace: kagent }   # the bundled provider's keys, for the gateway
spec:
  selector: { app.kubernetes.io/component: controller, app.kubernetes.io/instance: kagent }
  ports: [ { name: http, port: 5556, targetPort: 5556 } ]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: mcp-gateway, namespace: agentgateway-system }
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: https
      port: 8443
      protocol: HTTPS
      tls: { mode: Terminate, certificateRefs: [ { kind: Secret, name: mcp-gateway-tls } ] }
      allowedRoutes: { namespaces: { from: All } }
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata: { name: governed-mcp, namespace: agentgateway-system }
spec:
  entMcp:
    targets:
      - name: records
        static: { host: records-mcp.demo-tools.svc.cluster.local, port: 8000, path: /mcp, protocol: StreamableHTTP }
      - name: inventory
        static: { host: inventory-mcp.demo-tools.svc.cluster.local, port: 8000, path: /mcp, protocol: StreamableHTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: governed-mcp, namespace: agentgateway-system }
spec:
  parentRefs: [ { name: mcp-gateway } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /mcp } } ]
      backendRefs: [ { name: governed-mcp, group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend } ]
      timeouts: { request: "0s" }
---
# Who are you? Every call must carry a valid token from the sign-in provider.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-jwt, namespace: agentgateway-system }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: HTTPRoute, name: governed-mcp } ]
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: http://localhost:5556
          audiences: [ account ]
          jwks:
            remote:
              backendRef: { name: kagent-idp, namespace: kagent, port: 5556 }
              jwksPath: /keys
              cacheDuration: 5m
---
# What may you use? Filters tools/list and rejects tools/call, by group.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-tool-authz, namespace: agentgateway-system }
spec:
  targetRefs: [ { group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: governed-mcp } ]
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - "'admins' in jwt.Groups"
            - "'writers' in jwt.Groups && mcp.tool.target == 'inventory'"
---
# Personal data is masked in tool results before any agent sees it, for everyone.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-guardrails, namespace: agentgateway-system }
spec:
  targetRefs: [ { group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: governed-mcp } ]
  backend:
    mcp:
      guardrails:
        processors:
          - methods: { tools/call: Response }
            expression:
              transform: >-
                mcp.result.merge({
                  'content': mcp.result.content.map(c,
                    c.type == 'text'
                      ? c.merge({'text': c.text
                          .regexReplaceAll('\\b\\d{4}-\\d{2}-\\d{2}\\b', '[DOB REDACTED]')
                          .regexReplaceAll('\\b\\d{3}-\\d{3}-\\d{4}\\b', '[PHONE REDACTED]')})
                      : c)
                }).merge(
                  has(mcp.result.structuredContent) && has(mcp.result.structuredContent.result)
                    ? {'structuredContent': {'result': string(mcp.result.structuredContent.result)
                          .regexReplaceAll('\\b\\d{4}-\\d{2}-\\d{2}\\b', '[DOB REDACTED]')
                          .regexReplaceAll('\\b\\d{3}-\\d{3}-\\d{4}\\b', '[PHONE REDACTED]')}}
                    : {})
