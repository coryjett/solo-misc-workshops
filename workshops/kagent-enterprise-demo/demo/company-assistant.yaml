# Beat 4b: an agent whose tools come only through agentgateway, as the person chatting.
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: company-tools
  namespace: kagent
  labels: { kagent.dev/discovery: disabled }   # discovery has no user token; the gateway lists tools per user at chat time
spec:
  description: Customer records and inventory, through agentgateway
  url: https://mcp-gateway.agentgateway-system.svc.cluster.local:8443/mcp
  protocol: STREAMABLE_HTTP
  tokenPassthrough: true          # calls carry the signed-in user's token; it never enters the sandbox
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata: { name: company-assistant, namespace: kagent }
spec:
  description: Answers questions from company systems through agentgateway
  modelConfig: { name: default-model-config }
  systemPrompt: |
    You are the company assistant. Answer briefly from your tools; never guess.
    Your company system tools are the ones named records_* and inventory_*.
    If you have no tool for a question, say which system you cannot reach.
  tools:
  - mcp:
      server: { kind: RemoteMCPServer, name: company-tools }
      tools: [records_lookup_customer, records_account_status, inventory_check_stock, inventory_low_stock]
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata: { name: company-assistant, namespace: kagent }
spec:
  harnessRef: { name: kagent-default }
  template: { ref: { name: company-assistant } }
