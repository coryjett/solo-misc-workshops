# Who are you? Every MCP request must carry a valid token from the IdP (Keycloak here; Entra ID or Okta in production).
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-jwt, namespace: agentgateway-system }
spec:
  targetRefs: [ { group: gateway.networking.k8s.io, kind: HTTPRoute, name: governed-mcp } ]
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: ${OIDC_ISSUER}
          audiences: [ agentgateway ]
          jwks:
            remote:
              backendRef: { name: keycloak, namespace: keycloak, port: 8080 }
              jwksPath: /realms/${KC_REALM}/protocol/openid-connect/certs
              cacheDuration: 5m
