# Data guardrails, applied to everyone (even authorized users):
#   1. destructive tools are blocked at the gateway
#   2. PHI (dates of birth, phone numbers) is masked in tool RESULTS before they reach the AI client
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: mcp-guardrails, namespace: agentgateway-system }
spec:
  targetRefs: [ { group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayBackend, name: governed-mcp } ]
  backend:
    mcp:
      guardrails:
        processors:
          - methods: { tools/call: Request }
            expression:
              condition: "mcp.params.name.contains('delete_')"
              reject: "Blocked by policy: destructive tools are not available to AI clients"
          - methods: { tools/call: Response }
            expression:
              # Redact BOTH result channels: text content and structuredContent (a second copy many
              # MCP servers return). Missing either one leaks PHI.
              transform: >-
                mcp.result.merge({
                  'content': mcp.result.content.map(c,
                    c.type == 'text'
                      ? c.merge({'text': c.text
                          .regexReplaceAll('\\b\\d{4}-\\d{2}-\\d{2}\\b', '[DOB REDACTED]')
                          .regexReplaceAll('\\b\\d{3}-\\d{3}-\\d{4}\\b', '[PHONE REDACTED]')})
                      : c)
                }).merge(
                  has(mcp.result.structuredContent) && has(mcp.result.structuredContent.result)
                    ? {'structuredContent': {'result': string(mcp.result.structuredContent.result)
                          .regexReplaceAll('\\b\\d{4}-\\d{2}-\\d{2}\\b', '[DOB REDACTED]')
                          .regexReplaceAll('\\b\\d{3}-\\d{3}-\\d{4}\\b', '[PHONE REDACTED]')}}
                    : {})
