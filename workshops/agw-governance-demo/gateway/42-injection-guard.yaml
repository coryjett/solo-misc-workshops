# AI prompt-injection guard: a webhook guardrail service. A judge model (the self-hosted one by default)
# classifies each prompt before it reaches any model. Catches paraphrased/obfuscated attacks regex misses.
apiVersion: apps/v1
kind: Deployment
metadata: { name: injection-guard, namespace: ${TOOLS_NS}, labels: { app: injection-guard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: injection-guard } }
  template:
    metadata: { labels: { app: injection-guard } }
    spec:
      containers:
        - name: guard
          image: ${TOOLS_IMAGE}
          imagePullPolicy: Never
          command: [python, -u, injection_guard.py]
          env:
            - { name: JUDGE, value: openai }   # "local" = judge on the self-hosted model (needs it fast and idle)
            - { name: LOCAL_LLM_BASE_URL, value: "${LOCAL_LLM_BASE_URL}" }
            - { name: LOCAL_LLM_MODEL, value: "${LOCAL_LLM_MODEL}" }
          envFrom: [ { secretRef: { name: guard-keys } } ]
          ports: [ { containerPort: 8000 } ]
          readinessProbe: { tcpSocket: { port: 8000 }, periodSeconds: 3 }
---
apiVersion: v1
kind: Service
metadata: { name: injection-guard, namespace: ${TOOLS_NS} }
spec: { selector: { app: injection-guard }, ports: [ { name: http, port: 8000, targetPort: 8000 } ] }
---
# Allow the models (in agentgateway-system) to reference the guard Service across namespaces.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: { name: models-to-injection-guard, namespace: ${TOOLS_NS} }
spec:
  from: [ { group: agentgateway.dev, kind: AgentgatewayModel, namespace: agentgateway-system } ]
  to: [ { group: "", kind: Service, name: injection-guard } ]
