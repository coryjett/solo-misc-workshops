# Sales agents. Submitted by sales-dev, approved by approver. Fictional demo data.
apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: account-insights-assistant
  tag: "1.0.0"
  labels: {team: sales, owner: marcus.lee, service: sales-crm, use-case: account-engagement, data-class: pii, environment: prod, runtime: azure-foundry, model: gpt-5.4-mini, lifecycle: active}
  annotations:
    catalog.example/owner-email: marcus.lee@example.com
    catalog.example/runtime-detail: "Azure AI Foundry agent service, project comm-sales (demo)"
spec:
  title: Account Insights Assistant
  description: >-
    [team:sales owner:marcus.lee service:sales-crm data:pii runtime:azure-foundry model:gpt-5.4-mini] Pre-meeting briefings for field reps: customer interests, recent news, prior interactions.
  modelProvider: azure-openai
  modelName: gpt-5.4-mini
  source:
    protocol: A2A
  compatibleHarnesses: [{type: claude-code}]
  mcpServers:
    - {kind: MCPServer, name: crm-mcp, tag: "1.0.0"}
    - {kind: MCPServer, name: docs-search-mcp, tag: "1.0.0"}
  instructions: {kind: Prompt, name: pii-handling-guardrails, tag: "1.0.0"}
