apiVersion: ar.dev/v1alpha1
kind: Agent
metadata:
  name: customer-faq-responder
  tag: "1.0.0"
  labels: {team: sales, owner: marcus.lee, service: customer-support, use-case: customer-inquiry-response, data-class: pii, environment: prod, runtime: on-prem-k8s, model: llama-3.3-70b-onprem, lifecycle: active}
  annotations:
    catalog.example/owner-email: marcus.lee@example.com
    catalog.example/runtime-detail: "on-prem Kubernetes cluster dc1-k8s, namespace support (demo)"
    catalog.example/model-detail: "Llama 3.3 70B served by vLLM on on-prem GPU nodes"
spec:
  title: Customer FAQ Responder
  description: >-
    [team:sales owner:marcus.lee service:customer-support data:pii runtime:on-prem-k8s model:llama-3.3-70b-onprem] Drafts standard responses to unsolicited product inquiries from customers, citing documentation.
  modelProvider: vllm-onprem
  modelName: llama-3.3-70b-instruct
  source:
    protocol: A2A
  compatibleHarnesses: [{type: claude-code}]
  mcpServers:
