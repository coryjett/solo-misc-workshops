# The one governed MCP endpoint: a Gateway in agentgateway-system, exposed on the Mac at localhost:8081.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mcp-gateway
  namespace: agentgateway-system
  labels: { agentregistry.solo.io/runtime: mcp-gateway }   # the registry's Virtual runtime "mcp-gateway" owns this gateway
spec:
  gatewayClassName: enterprise-agentgateway
  infrastructure:
    parametersRef: { group: enterpriseagentgateway.solo.io, kind: EnterpriseAgentgatewayParameters, name: mcp-gateway-params }
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces: { from: All }
        kinds:
          - { group: gateway.networking.k8s.io, kind: HTTPRoute }
          - { group: agentgateway.dev, kind: AgentgatewayModel }
    # Same routes over TLS, for in-cluster callers that require HTTPS (kagent agents calling as the user).
    - name: https
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs: [ { kind: Secret, name: mcp-gateway-tls } ]
      allowedRoutes:
        namespaces: { from: All }
        kinds:
          - { group: gateway.networking.k8s.io, kind: HTTPRoute }
          - { group: agentgateway.dev, kind: AgentgatewayModel }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-gateway-nodeport, namespace: agentgateway-system }
spec:
  type: NodePort
  selector: { gateway.networking.k8s.io/gateway-name: mcp-gateway }
  ports: [ { name: http, port: 8080, targetPort: 8080, nodePort: ${GW_NODE_PORT} } ]
---
# Route delegation for the registry: anything the registry exposes lands under /registry/... on this gateway.
# The registry creates child HTTPRoutes in agentregistry-system; this parent hands /registry to them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentregistry-delegate
  namespace: agentgateway-system
  labels: { agentregistry.solo.io/runtime: mcp-gateway }
spec:
  parentRefs: [ { name: mcp-gateway } ]
  rules:
    - matches: [ { path: { type: PathPrefix, value: /registry } } ]
      backendRefs:
        - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: "*", namespace: agentregistry-system }
