# Shadow IT for segment 1: kagent resources that are running but NOT in the registry catalog.
# ARE discovers them through the onprem-k8s-kagent runtime (Instances, Managed filter = unmanaged;
# arctl get deployments --origin discovered). Apply: kubectl --context kind-agentic-demo apply -f deploy/shadow-it.yaml
# Remove:  kubectl --context kind-agentic-demo -n kagent delete agents.kagent.dev,remotemcpservers.kagent.dev -l shadow-demo=true
# Agent pods stay in CreateContainerConfigError (placeholder model key): no CPU, discovery still lists them.
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: churn-cohort-builder
  namespace: kagent
  labels: {shadow-demo: "true"}
spec:
  type: Declarative
  description: "Customer churn cohort builder (unregistered)"
  declarative:
    modelConfig: default-model-config
    systemMessage: "Customer churn cohort builder."

