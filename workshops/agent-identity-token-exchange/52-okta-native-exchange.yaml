# Part 3: exchange at your Okta authorization server, performed by agentgateway itself.
#
#   kubectl -n agent-identity create secret generic okta-client-secret \
#     --from-literal=clientSecret="${OKTA_CLIENT_SECRET}"
#   set -a; . /path/to/.env; set +a
#   envsubst < 52-okta-native-exchange.yaml | kubectl apply -f -
#
# Self-contained: its own echo MCP server and /mcp-echo route, so it neither disturbs nor is
# disturbed by the mcp-a and mcp-b policies from Parts 1, 2 and 4. The echo server returns the
# Authorization it received, which is the only way to see that the swap happened.
#
# No translator. The gateway speaks RFC 8693 to Okta directly, supplying client
# authentication, `audience` and `scope` from the config below.
#
# The client secret key MUST be `clientSecret`. With any other key the policy still reports
# Accepted (reason PartiallyValid) and the gateway forwards the CALLER'S OWN TOKEN to the
# backend. Tracked as solo-io/agentgateway-enterprise#7824.
---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: agent-identity
  name: mcp-echo-script
data:
  server.py: |
    """MCP server that returns the inbound Authorization for inspection."""
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import base64, json, sys

    def decode_jwt(token):
        try:
            p = token.split('.')[1]; p += '=' * (4 - len(p) % 4)
            return json.loads(base64.urlsafe_b64decode(p))
        except Exception as e:
            return {"_decode_error": str(e)}

    class H(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        def log_message(self, *a): pass
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get('Content-Length', 0))).decode()
            try: req = json.loads(body)
            except: req = {}
            method, rid = req.get('method', ''), req.get('id')
            auth = self.headers.get('Authorization', '')
            token = auth[7:] if auth.startswith('Bearer ') else ''

            if method == 'initialize':
                resp = {"jsonrpc":"2.0","id":rid,"result":{"protocolVersion":"2024-11-05",
                  "capabilities":{"tools":{"listChanged":False}},
                  "serverInfo":{"name":"okta-echo","version":"1.0"}}}
            elif method == 'notifications/initialized':
                self.send_response(200); self.end_headers(); return
            elif method == 'tools/list':
                resp = {"jsonrpc":"2.0","id":rid,"result":{"tools":[
                  {"name":"whoami","description":"echoes the inbound Authorization token",
                   "inputSchema":{"type":"object","properties":{}}}]}}
            elif method == 'tools/call':
                claims = decode_jwt(token) if token else None
                result = {
                    "token_preview": (token[:24]+"..."+token[-12:]) if token else "(none)",
                    "is_jwt": token.count('.') == 2,
                    "claims": claims,
                    "audience": claims.get('aud') if claims else None,
                    "issuer": claims.get('iss') if claims else None,
                    "scope": claims.get('scp') or claims.get('scope') if claims else None,
                    "subject": claims.get('sub') if claims else None,
                }
                resp = {"jsonrpc":"2.0","id":rid,"result":{"content":[
                  {"type":"text","text": json.dumps(result, indent=2)}]}}
            else:
                resp = {"jsonrpc":"2.0","id":rid,"error":{"code":-32601,"message":f"Unknown: {method}"}}
            out = json.dumps(resp).encode()
            self.send_response(200)
            self.send_header('Content-Type','application/json')
            self.send_header('Content-Length', str(len(out)))
            self.end_headers(); self.wfile.write(out)

    if __name__ == '__main__':
        sys.stderr.write("MCP echo on :80\n"); sys.stderr.flush()
        HTTPServer(('', 80), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: agent-identity
  name: mcp-echo
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-echo } }
  template:
    metadata: { labels: { app: mcp-echo } }
    spec:
      containers:
      - name: echo
        image: python:3.12-slim
        command: ["python","/app/server.py"]
        ports: [{ containerPort: 80 }]
        volumeMounts: [{ name: script, mountPath: /app }]
      volumes:
      - name: script
        configMap: { name: mcp-echo-script, items: [{ key: server.py, path: server.py }] }
---
apiVersion: v1
kind: Service
metadata:
  namespace: agent-identity
  name: mcp-echo
spec:
  selector: { app: mcp-echo }
  ports:
  - { port: 80, targetPort: 80, appProtocol: agentgateway.dev/mcp }
---
# nginx passthrough so the JWT policy's jwks.remote.backendRef can resolve in-cluster.
apiVersion: v1
kind: ConfigMap
metadata: { name: okta-jwks-proxy-conf, namespace: agent-identity }
data:
  default.conf: |
    server {
      listen 8080;
      resolver 8.8.8.8 ipv6=off;
      location /keys {
        proxy_ssl_server_name on;
        proxy_pass https://${OKTA_DOMAIN}/oauth2/${OKTA_AS_ID}/v1/keys;
        proxy_set_header Host ${OKTA_DOMAIN};
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: okta-jwks-proxy, namespace: agent-identity }
spec:
  replicas: 1
  selector: { matchLabels: { app: okta-jwks-proxy } }
  template:
    metadata: { labels: { app: okta-jwks-proxy } }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d }]
      volumes:
        - name: conf
          configMap: { name: okta-jwks-proxy-conf }
---
apiVersion: v1
kind: Service
metadata: { name: okta-jwks-proxy, namespace: agent-identity }
spec:
  selector: { app: okta-jwks-proxy }
  ports: [{ port: 8080, targetPort: 8080 }]
---
# Okta's token endpoint as an upstream. TLS is required; an empty tls policy is enough.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata: { name: okta-sts, namespace: agent-identity }
spec:
  static: { host: "${OKTA_DOMAIN}", port: 443 }
  policies:
    tls: {}
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata: { name: mcp-echo, namespace: agent-identity }
spec:
  mcp:
    targets:
      - name: echo
        static: { host: mcp-echo.agent-identity.svc.cluster.local, port: 80, protocol: StreamableHTTP }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: mcp-echo, namespace: agent-identity }
spec:
  parentRefs: [{ name: e2e-gw }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /mcp-echo } }]
      backendRefs: [{ name: mcp-echo, group: agentgateway.dev, kind: AgentgatewayBackend }]
---
# Inbound: validate the user's Okta token. preserveToken keeps it available for the exchange.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: inbound-okta-jwt, namespace: agent-identity }
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: mcp-echo }
  traffic:
    jwtAuthentication:
      mode: Strict
      preserveToken: true
      providers:
        - issuer: "https://${OKTA_DOMAIN}/oauth2/${OKTA_AS_ID}"
          audiences: ["${OKTA_AUDIENCE}"]
          jwks:
            remote:
              backendRef: { name: okta-jwks-proxy, namespace: agent-identity, port: 8080 }
              jwksPath: /keys
---
# The exchange itself, attached to the backend rather than the route.
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata: { name: okta-native-exchange, namespace: agent-identity }
spec:
  targetRefs:
    - { group: agentgateway.dev, kind: AgentgatewayBackend, name: mcp-echo }
  backend:
    entTokenExchange:
      okta:
        audience: "${OKTA_AUDIENCE}"
        authServerId: "${OKTA_AS_ID}"
        scopes: ["${OKTA_SCOPE}"]
        backendRef:
          group: agentgateway.dev
          kind: AgentgatewayBackend
          name: okta-sts
        clientAuth:
          clientId: "${OKTA_CLIENT_ID}"
          secretRef: { name: okta-client-secret }
          authMethod: ClientSecretPost
